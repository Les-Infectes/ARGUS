<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARGUS — Cartographie</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      font-family: "JetBrains Mono", monospace;
      --navy: #0f172a;
      --navy-light: #1e293b;
      --ink: #0a0a0a;
      --muted: #475569;
      --border: #cbd5e1;
      --surface: #f1f5f9;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      background: #f8fafc;
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }

    /* ── TOOLBAR (single bar) ── */
    .toolbar {
      padding: 6px 16px;
      background: var(--navy);
      border-bottom: 2px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-group label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #93c5fd;
      white-space: nowrap;
    }
    .toolbar-group input[type="file"] {
      font-size: 0.7rem;
      max-width: 150px;
      color: #cbd5e1;
    }
    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: #334155;
    }
    .tier-btn {
      padding: 4px 12px;
      border-radius: 6px;
      border: 2px solid #475569;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tier-btn:hover { background: #1e293b; }
    .tier-btn.active { font-weight: 800; color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .toggle-ad-btn {
      padding: 4px 14px;
      border-radius: 6px;
      border: 2px solid #475569;
      background: transparent;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-ad-btn:hover { background: #1e293b; }
    .toggle-ad-btn:disabled { opacity: 0.3; cursor: default; }
    #status {
      font-size: 0.7rem;
      font-weight: 500;
      color: #94a3b8;
      margin-left: auto;
    }

    /* ── GRAPH AREA ── */
    #cy {
      flex: 1;
      position: relative;
      background: #ffffff;
      min-height: 0;
      overflow: hidden;
    }

    /* ── EDGE TOOLTIP ── */
    #edge-tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.92);
      color: #f1f5f9;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.78rem;
      font-family: "JetBrains Mono", monospace;
      line-height: 1.55;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 9999;
      max-width: 260px;
      display: none;
    }
    #edge-tooltip .et-main { font-weight: 700; color: #93c5fd; margin-bottom: 0.3rem; }
    #edge-tooltip .et-list { display: flex; flex-direction: column; gap: 0.15rem; }
    #edge-tooltip .et-item { color: #cbd5e1; }
    #edge-tooltip .et-item.et-primary { color: #fbbf24; }
    #edge-tooltip .et-synthetic { color: #86efac; font-size: 0.72rem; margin-bottom: 0.3rem; font-style: italic; }
    #edge-tooltip.pinned { border: 1px solid rgba(147, 197, 253, 0.4); }

    /* ── NODE CARD (hover detail) ── */
    .node-card {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 0);
      min-width: 240px;
      max-width: 340px;
      padding: 0.9rem 1rem;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(248,250,252,0.96));
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(15,23,42,0.15);
      font-size: 0.82rem;
      line-height: 1.4;
      color: var(--ink);
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
      z-index: 3;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .node-card.show { opacity: 1; }
    .node-card-header {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--navy);
    }
    .node-card-body {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      font-family: "JetBrains Mono", monospace;
    }
    .node-card-body span {
      display: block;
      padding: 0.3rem 0.4rem;
      border-radius: 4px;
      background: rgba(15,23,42,0.04);
    }
    .node-card-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      font-family: "JetBrains Mono", monospace;
    }
    .node-card-table th, .node-card-table td {
      text-align: left;
      padding: 0.2rem 0.3rem;
      border-bottom: 1px solid rgba(15,23,42,0.08);
      vertical-align: top;
      word-break: break-word;
    }
    .node-card-table th {
      background: rgba(15,23,42,0.05);
      font-weight: 700;
      color: var(--navy);
    }
  </style>
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <span style="font-size:0.9rem;font-weight:800;letter-spacing:0.2em;color:#fff;white-space:nowrap;">ARGUS</span>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <label>Reseau</label>
      <input id="file" type="file" accept="application/json" />
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <label>Mapping</label>
      <input id="mapping-file" type="file" accept="application/json" />
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <label>Graphe AD</label>
      <input id="ad-file" type="file" accept="application/json" multiple />
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group" id="tier-buttons"></div>
    <button id="toggle-ad" class="toggle-ad-btn" type="button" disabled>Afficher AD</button>
    <span id="status">Aucun fichier.</span>
  </div>

  <div id="cy">
    <div id="node-card" class="node-card"></div>
    <div id="edge-tooltip"></div>
  </div>

  <script>
    let cy = null;
    const statusEl = document.getElementById("status");
    const fileInput = document.getElementById("file");
    const nodeCard = document.getElementById("node-card");
    let selectedNode = null;
    let subnetLayoutRunning = false;
    let adElements = [];
    let adLoaded = false;
    let hostIndex = new Map();
    let nodeDataIndex = new Map();
    let traceOrder = [];
    let adGraphState = null;
    let adGraphRaw = null;
    let hostnameMapping = null;

    // Multi-tier support
    let loadedTiers = {};
    let currentTier = null;
    let adVisible = false;

    // === PALETTE RESEAU ===
    const typeColors = {
      network: "#1e3a5f",
      subnet: "#1e3a5f",
      domain: "#0ea5e9",
      router: "#f97316",
      firewall: "#f87171",
      switch: "#22d3ee",
      dc: "#60a5fa",
      server: "#38bdf8",
      workstation: "#a78bfa",
      unknown: "#64748b",
    };
    const typeLabels = {
      network: "Reseau local", subnet: "Sous-reseau", domain: "Domaine",
      router: "Routeur", firewall: "Firewall", switch: "Switch",
      dc: "Domain Controller", server: "Serveur", workstation: "Poste", unknown: "Inconnu",
    };

    // === PALETTE IDENTITE AD ===
    const adTypeColors = {
      User: "#facc15", Group: "#f472b6", Computer: "#a78bfa",
      Domain: "#f87171", OU: "#fb923c", GPO: "#a3e635",
      Container: "#2dd4bf", CertTemplate: "#e879f9", Unknown: "#64748b",
    };
    const tierColors = { 0: "#f87171", 1: "#fb923c", 2: "#facc15" };
    const tierBorderColors = { 0: "#ef4444", 1: "#f97316", 2: "#eab308" };
    const tierNames = { 0: "Tier 0", 1: "Tier 1", 2: "Tier 2" };
    const START_USER_COLOR = "#4ade80";
    const START_USER_BORDER = "#22c55e";

    // ── File handlers ──
    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      statusEl.textContent = `Lecture de ${file.name}...`;
      try {
        const raw = await file.text();
        const scan = JSON.parse(raw);
        renderGraph(scan);
        applyHostnameMapping();
        statusEl.textContent = `${file.name} charge.`;
      } catch (err) {
        statusEl.textContent = `Erreur : ${err.message}`;
      }
    });

    function applyHostnameMapping() {
      if (!hostnameMapping) return;
      Object.entries(hostnameMapping).forEach(([hostname, info]) => {
        const ips = info.ips || [];
        const normalizedHost = hostname.toLowerCase();
        const shortHost = normalizedHost.split(".")[0];
        ips.forEach(ip => {
          const nodeId = `ip_${ip}`;
          hostIndex.set(shortHost, nodeId);
          hostIndex.set(normalizedHost, nodeId);
          hostIndex.set(ip, nodeId);
          // Update hostname on the node data + refresh label in cytoscape
          const nodeData = nodeDataIndex.get(nodeId);
          if (nodeData && !nodeData.hostname) {
            nodeData.hostname = info.hostname || hostname;
            nodeData.label = buildNetworkLabel(nodeData);
          }
          if (cy) {
            const cyNode = cy.getElementById(nodeId);
            if (cyNode.length && !cyNode.data("hostname")) {
              cyNode.data("hostname", info.hostname || hostname);
              cyNode.data("label", buildNetworkLabel({ ip, hostname: info.hostname || hostname }));
            }
          }
        });
      });
    }

    const mappingFileInput = document.getElementById("mapping-file");
    if (mappingFileInput) {
      mappingFileInput.addEventListener("change", async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const raw = await file.text();
          const data = JSON.parse(raw);
          hostnameMapping = data.mapping || {};
          applyHostnameMapping();
          statusEl.textContent = `Mapping: ${Object.keys(hostnameMapping).length} entree(s).`;
        } catch (err) {
          statusEl.textContent = `Erreur mapping: ${err.message}`;
        }
      });
    }

    const adFileInput = document.getElementById("ad-file");
    const adToggleButton = document.getElementById("toggle-ad");
    const tierButtonsContainer = document.getElementById("tier-buttons");

    function updateTierButtons() {
      tierButtonsContainer.innerHTML = "";
      const tiers = Object.keys(loadedTiers).sort((a, b) => a - b);
      tiers.forEach(tier => {
        const btn = document.createElement("button");
        btn.className = "tier-btn" + (currentTier == tier ? " active" : "");
        btn.dataset.tier = tier;
        btn.textContent = `T${tier}`;
        btn.style.borderColor = tierBorderColors[tier] || "#6b7280";
        if (currentTier == tier) { btn.style.background = tierColors[tier]; btn.style.color = "#0f172a"; }
        btn.addEventListener("click", () => switchToTier(parseInt(tier)));
        tierButtonsContainer.appendChild(btn);
      });
      if (adToggleButton) adToggleButton.disabled = tiers.length === 0;
    }

    function switchToTier(tier) {
      if (!loadedTiers[tier] || !cy) return;
      if (adVisible) cy.elements('[isAD]').remove();
      currentTier = tier;
      adGraphRaw = loadedTiers[tier].raw;
      adElements = loadedTiers[tier].elements;
      adGraphState = loadedTiers[tier].graphState;
      adLoaded = true;
      if (adVisible) { cy.add(adElements); runLayouts(); }
      updateTierButtons();
      if (adToggleButton) adToggleButton.textContent = adVisible ? `Masquer T${tier}` : `Afficher T${tier}`;
    }

    if (adFileInput) {
      adFileInput.addEventListener("change", async (event) => {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        for (const file of files) {
          try {
            const raw = await file.text();
            const adGraph = JSON.parse(raw);
            const tier = adGraph.tier !== undefined ? adGraph.tier : (adGraph.mode || 0);
            const elements = buildAdElements(adGraph);
            loadedTiers[tier] = { raw: adGraph, elements, graphState: adGraphState };
            statusEl.textContent = `Tier ${tier} charge (${file.name})`;
          } catch (err) {
            statusEl.textContent = `Erreur : ${err.message}`;
          }
        }
        updateTierButtons();
        const tiers = Object.keys(loadedTiers).sort((a, b) => a - b);
        if (tiers.length > 0 && currentTier === null) switchToTier(parseInt(tiers[0]));
        if (!cy && tiers.length > 0) initCytoscapeAdOnly();
      });
    }

    // ── Cytoscape Styles ──
    function getCytoscapeStyles() {
      return [
        {
          selector: "node",
          style: {
            label: "data(label)",
            "text-wrap": "wrap",
            "text-max-width": 160,
            "background-color": "data(bg)",
            "border-color": "data(borderColor)",
            "border-width": 2,
            color: "data(textColor)",
            "font-size": 13,
            "font-family": "JetBrains Mono, monospace",
            "line-height": 1.4,
            "font-weight": "600",
            "text-valign": "center",
            "text-halign": "center",
            "shape": "round-rectangle",
            "padding": "10px",
            "width": "label",
            "height": "label",
          }
        },
        {
          selector: "node[isGroup = 1]",
          style: {
            "shape": "round-rectangle",
            "background-opacity": 0.06,
            "border-style": "dashed",
            "border-width": 1,
            "border-color": "#94a3b8",
            "text-valign": "top",
            "text-halign": "center",
            "font-size": 10,
            "color": "#475569",
            "padding": "40px",
            "compound-sizing-wrt-labels": "include",
          }
        },
        {
          selector: "node[isZone = 1]",
          style: {
            "shape": "round-rectangle",
            "background-opacity": 0.02,
            "border-style": "dotted",
            "border-width": 1.5,
            "border-color": "#94a3b8",
            "text-valign": "top",
            "text-halign": "right",
            "font-size": 13,
            "font-weight": "700",
            "color": "#0f172a",
            "text-margin-y": -8,
            "padding": "24px",
          }
        },
        {
          selector: "node[?isTarget]",
          style: { "border-width": 2.5, "font-weight": "700" }
        },
        {
          selector: "node[?isStart]",
          style: {
            "background-color": "#4ade80", "border-width": 3, "border-color": "#22c55e",
            "border-style": "solid", "font-weight": "700", "font-size": 13, "color": "#052e16",
          }
        },
        // Router nodes: circle shape, orange
        {
          selector: "node[nodeType = 'router']",
          style: { "shape": "ellipse", "width": 44, "height": 44, "font-size": 11 }
        },
        {
          selector: "edge",
          style: {
            width: 1.2,
            "line-color": "#94a3b8",
            "target-arrow-color": "#94a3b8",
            "target-arrow-shape": "triangle",
            "curve-style": "bezier",
            "font-size": 9,
            color: "#475569",
            "text-background-color": "#ffffff",
            "text-background-opacity": 0.9,
            "text-background-padding": 2,
          }
        },
        // Network edges
        { selector: "edge[kind = 'network']", style: { "line-color": "#94a3b8", "target-arrow-color": "#94a3b8", "target-arrow-shape": "none", width: 1 } },
        { selector: "edge[kind = 'subnet']", style: { "line-color": "#94a3b8", "target-arrow-color": "#94a3b8", width: 1 } },
        // AD edges: secondary paths (black solid)
        { selector: "edge[kind = 'ad']", style: { label: "data(label)", "line-color": "#0f172a", "target-arrow-color": "#0f172a", width: 1.2 } },
        // AD shortest path: red solid
        { selector: "edge[kind = 'ad'][isShortest = 1]", style: { "line-color": "#ef4444", "target-arrow-color": "#ef4444", width: 1.5 } },
        // Bridge edges (AD ↔ network node)
        { selector: "edge[kind = 'bridge']", style: { label: "data(label)", "line-color": "#0f172a", "target-arrow-color": "#0f172a", width: 1.2 } },
        { selector: "edge[kind = 'bridge'][isShortest = 1]", style: { "line-color": "#ef4444", "target-arrow-color": "#ef4444", width: 1.5 } },
        // Edges via Computer: black dashed (uncertain — requires local admin)
        { selector: "edge[viaComputer = 1]", style: { "line-color": "#0f172a", "target-arrow-color": "#0f172a", "line-style": "dashed", width: 1.2 } },
        { selector: "edge[viaComputer = 1][isShortest = 1]", style: { "line-color": "#0f172a", "target-arrow-color": "#0f172a", "line-style": "dashed", width: 1.2 } }
      ];
    }

    // ── Edge tooltip ──
    const edgeTip = document.getElementById("edge-tooltip");
    let edgeTipPinned = false;

    function buildEdgeTipHTML(d) {
      const primary = d.label || "";
      const rights = (d.allRights && d.allRights.length > 0) ? d.allRights : [primary];
      const primaryInList = rights.includes(primary);
      const rows = rights.map(r =>
        `<span class="et-item${r === primary ? " et-primary" : ""}">${r === primary ? "-> " : "   "}${r}</span>`
      ).join("");
      const syntheticNote = !primaryInList && primary
        ? `<div class="et-synthetic">affiche : ${primary}</div>` : "";
      const count = rights.length > 1 ? ` (${rights.length})` : "";
      return `<div class="et-main">Permissions${count}</div>${syntheticNote}<div class="et-list">${rows}</div>`;
    }

    function positionEdgeTip(pageX, pageY) {
      edgeTip.style.left = "0px"; edgeTip.style.top = "0px"; edgeTip.style.display = "block";
      const tipW = edgeTip.offsetWidth, tipH = edgeTip.offsetHeight;
      const vw = window.innerWidth, vh = window.innerHeight;
      const x = (pageX + 16 + tipW > vw) ? pageX - tipW - 10 : pageX + 16;
      const y = (pageY + 16 + tipH > vh) ? pageY - tipH - 10 : pageY + 16;
      edgeTip.style.left = x + "px"; edgeTip.style.top = y + "px";
    }

    function edgeScreenPos(evt, edge) {
      const oe = evt.originalEvent;
      if (oe && typeof oe.clientX === "number") return { x: oe.clientX, y: oe.clientY };
      try {
        const mid = edge.renderedMidpoint();
        const rect = cy.container().getBoundingClientRect();
        return { x: rect.left + mid.x, y: rect.top + mid.y };
      } catch(e) {
        return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
      }
    }

    function setupEdgeTooltip() {
      edgeTipPinned = false; edgeTip.style.display = "none";
      cy.on("mouseover", "edge", (evt) => {
        if (edgeTipPinned) return;
        const d = evt.target.data();
        if (!d.label) return;
        edgeTip.innerHTML = buildEdgeTipHTML(d);
        const pos = edgeScreenPos(evt, evt.target);
        positionEdgeTip(pos.x, pos.y);
      });
      cy.on("mousemove", "edge", (evt) => {
        if (edgeTipPinned || edgeTip.style.display === "none") return;
        const oe = evt.originalEvent;
        if (oe && typeof oe.clientX === "number") positionEdgeTip(oe.clientX, oe.clientY);
      });
      cy.on("mouseout", "edge", () => { if (!edgeTipPinned) edgeTip.style.display = "none"; });
      cy.on("tap", "edge", (evt) => {
        const d = evt.target.data();
        if (!d.label) return;
        edgeTip.innerHTML = buildEdgeTipHTML(d);
        const pos = edgeScreenPos(evt, evt.target);
        positionEdgeTip(pos.x, pos.y);
        edgeTipPinned = true;
      });
      cy.on("tap", (evt) => { if (evt.target === cy) { edgeTip.style.display = "none"; edgeTipPinned = false; } });
      cy.on("tap", "node", () => { edgeTip.style.display = "none"; edgeTipPinned = false; });
    }

    // ── Init AD-only mode ──
    function initCytoscapeAdOnly() {
      if (cy) cy.destroy();
      const elements = currentTier !== null && loadedTiers[currentTier] ? loadedTiers[currentTier].elements : [];
      cy = cytoscape({
        container: document.getElementById("cy"),
        elements: elements,
        style: getCytoscapeStyles(),
        layout: { name: "preset" },
        wheelSensitivity: 0.2,
        pixelRatio: "auto",
        textureOnViewport: false,
      });
      cy.on("select", "node", (event) => { selectedNode = event.target; showNodeCard(selectedNode); });
      cy.on("unselect", "node", () => { selectedNode = null; nodeCard.classList.remove("show"); nodeCard.innerHTML = ""; });
      cy.on("pan zoom layoutstop", updateNodeCardPosition);
      cy.on("render", updateNodeCardPosition);
      setupEdgeTooltip();
      adVisible = true;
      if (adToggleButton) { adToggleButton.textContent = `Masquer T${currentTier}`; adToggleButton.disabled = false; }
      statusEl.textContent = `Graphe AD Tier ${currentTier} charge.`;
      runLayouts();
    }

    if (adToggleButton) {
      adToggleButton.addEventListener("click", () => {
        if (!cy || !adLoaded || currentTier === null) return;
        if (adVisible) {
          cy.elements('[isAD]').remove();
          adVisible = false;
          adToggleButton.textContent = `Afficher T${currentTier}`;
        } else {
          cy.add(adElements);
          adVisible = true;
          adToggleButton.textContent = `Masquer T${currentTier}`;
          runLayouts();
        }
      });
    }

    // ── Render network graph ──
    function renderGraph(scan) {
      const { nodes, edges } = buildElements(scan);
      const wasAdVisible = adVisible;
      const previousTier = currentTier;
      if (cy) cy.destroy();
      adElements = []; adVisible = false;
      if (previousTier !== null && loadedTiers[previousTier]) {
        adElements = loadedTiers[previousTier].elements;
        adGraphRaw = loadedTiers[previousTier].raw;
        adLoaded = true;
      }
      if (adToggleButton) {
        adToggleButton.disabled = Object.keys(loadedTiers).length === 0;
        adToggleButton.textContent = currentTier !== null ? `Afficher T${currentTier}` : "Afficher AD";
      }
      cy = cytoscape({
        container: document.getElementById("cy"),
        elements: [...nodes, ...edges],
        style: getCytoscapeStyles(),
        layout: { name: "preset" },
        wheelSensitivity: 0.2,
        pixelRatio: "auto",
        textureOnViewport: false,
      });
      cy.on("select", "node", (event) => { selectedNode = event.target; showNodeCard(selectedNode); });
      cy.on("unselect", "node", () => { selectedNode = null; nodeCard.classList.remove("show"); nodeCard.innerHTML = ""; });
      cy.on("pan zoom layoutstop", updateNodeCardPosition);
      cy.on("render", updateNodeCardPosition);
      setupEdgeTooltip();
      statusEl.textContent = "Graphe reseau charge.";
      runLayouts();
      if (wasAdVisible && adElements.length > 0) {
        setTimeout(() => {
          cy.add(adElements); adVisible = true;
          if (adToggleButton) adToggleButton.textContent = `Masquer T${currentTier}`;
          runLayouts();
        }, 100);
      }
    }

    // ── Role detection ──
    const ROLE_PRIORITY = ["Domain Controller", "Routeur", "Serveur", "Poste", "Inconnu"];
    const roleToType = {
      "Domain Controller": "dc", "Routeur": "router", "Serveur": "server",
      "Poste": "workstation", "Inconnu": "unknown", "Firewall": "firewall", "Switch": "switch",
    };
    const serverPorts = new Set([21,22,23,25,53,80,110,111,143,389,443,445,465,587,636,993,995,1433,1521,2049,3306,3389,5432,5900,6379,8080,8443,27017,5985,5986,9200]);
    const workstationPorts = new Set([135,139,445,3389,5985,5986,47001]);
    const serverServiceNames = new Set(["http","https","ssh","ftp","smtp","imap","pop3","ldap","ldaps","kerberos","kpasswd","dns","domain","mysql","mssql","postgres","mongodb","redis","smb","microsoft-ds","netbios-ssn","nfs","rdp"]);

    function isOpenService(service) { const s = (service.state || "").toLowerCase(); return !s || s === "open"; }
    function hasOpenPort(services, port, protocols) {
      const allowed = new Set((protocols || ["tcp"]).map(p => p.toLowerCase()));
      return services.some(s => Number(s.port) === port && allowed.has((s.protocol || "tcp").toLowerCase()) && isOpenService(s));
    }
    function isDomainController(services) {
      if (!services || !services.length) return false;
      return (hasOpenPort(services, 88, ["tcp","udp"])) && (hasOpenPort(services, 389, ["tcp"]) || hasOpenPort(services, 636, ["tcp"]));
    }
    function isServer(services) {
      if (!services || !services.length) return false;
      return services.some(s => { if (!isOpenService(s)) return false; return serverPorts.has(Number(s.port)) || serverServiceNames.has((s.service||s.product||"").toLowerCase()); });
    }
    function isWorkstation(services) {
      if (!services || !services.length) return false;
      const openPorts = services.filter(isOpenService).map(s => Number(s.port)).filter(p => Number.isFinite(p));
      if (!openPorts.length) return false;
      return openPorts.every(port => workstationPorts.has(port));
    }
    function deriveRole(data) {
      const services = data.services || [];
      if (isDomainController(services)) return "Domain Controller";
      if (data.meta?.isRouter) return "Routeur";
      if (data.meta?.roleHint === "Serveur") return "Serveur";
      if (isServer(services)) return "Serveur";
      if (isWorkstation(services) || services.length) return "Poste";
      return "Inconnu";
    }

    function buildNetworkLabel(data) {
      const ip = data.ip || "";
      const hostname = data.hostname ? data.hostname.toUpperCase() : "";
      if (hostname && hostname.toLowerCase() !== ip.toLowerCase()) return `${ip}\n${hostname}`;
      return ip || data.id;
    }

    // ── Build network elements ──
    function buildElements(scan) {
      const nodes = [];
      const edges = [];
      const nodeMap = new Map();
      hostIndex = new Map();
      nodeDataIndex = new Map();
      const serviceMap = new Map(
        (scan.service_scan?.results || []).map(entry => [entry.ip, {
          services: entry.services || [], os: entry.os || "", hostname: entry.hostname || ""
        }])
      );

      const toId = (value) => value.replace(/[^0-9A-Za-z_:\-\.]/g, "_");

      const normalizeServices = (serviceBlock) => {
        const services = serviceBlock?.services || [];
        if (!services || !services.length) return [];
        return services.map(s => ({
          port: s.port ?? "?", protocol: (s.protocol || "tcp").toLowerCase(),
          state: s.state || "unknown", service: s.service || s.name || "",
          product: s.product || "", version: s.version || "", extrainfo: s.extrainfo || ""
        }));
      };

      const applyRoleAndType = (data) => {
        data.role = deriveRole(data);
        data.roles = [data.role];
        const type = roleToType[data.role] || "unknown";
        data.meta.type = type;
        data.nodeType = type;
        data.bg = typeColors[type] || typeColors.unknown;
        data.textColor = "#0f172a";
        data.borderColor = "#94a3b8";
      };

      const updateNode = (id, data) => {
        if (!nodeMap.has(id)) { nodeMap.set(id, { data: { ...data } }); return; }
        const existing = nodeMap.get(id).data;
        existing.meta = { ...(existing.meta || {}), ...(data.meta || {}) };
        existing.hostname = data.hostname || existing.hostname;
        existing.services = data.services?.length ? data.services : existing.services;
        applyRoleAndType(existing);
        existing.label = buildNetworkLabel(existing);
        nodeDataIndex.set(id, existing);
      };

      const addIpNode = (ip, role, meta = {}) => {
        if (!ip) return null;
        const id = toId(`ip_${ip}`);
        const serviceBlock = serviceMap.get(ip) || {};
        const services = normalizeServices(serviceBlock);
        const data = {
          id, ip, hostname: meta.hostname || serviceBlock.hostname || "",
          services, context: meta.context || "",
          meta: { os: serviceBlock.os || "", ...meta },
        };
        if (role) {
          data.meta.roleHint = role;
          if (role === "Routeur") data.meta.isRouter = true;
        }
        applyRoleAndType(data);
        data.label = buildNetworkLabel(data);
        updateNode(id, data);
        return id;
      };

      const addGroupNode = (id, label, type) => {
        nodeMap.set(id, { data: {
          id, label,
          bg: typeColors[type] || typeColors.unknown,
          borderColor: "#94a3b8", textColor: "#0f172a",
          meta: { type }, isGroup: 1
        }});
        return id;
      };

      const addZoneNode = (id, label) => {
        nodeMap.set(id, { data: {
          id, label,
          bg: "rgba(15, 23, 42, 0.02)",
          borderColor: "#64748b", textColor: "#0f172a",
          meta: { type: "zone" }, isGroup: 1, isZone: 1
        }});
        return id;
      };

      // Simplified edge: no labels for network, just structural connections
      const addEdge = (from, to, kind = "network") => {
        if (!from || !to) return;
        edges.push({ data: { id: `${from}_${to}_${kind}`, source: from, target: to, label: "", kind } });
      };

      const config = scan.configuration || {};
      addZoneNode("zone_network", "RESEAU");

      // Track which IPs are assigned to a subnet (to avoid double-parenting)
      const assignedToSubnet = new Set();
      // Traceroute order for subnet layout ordering
      traceOrder = scan.router_discovery?.trace_discovered || [];

      if (config.gateway) {
        addIpNode(config.gateway, "Routeur", { isRouter: true });
      }
      if (config.dns && config.dns !== config.gateway) {
        addIpNode(config.dns, "Serveur", { roleHint: "Serveur" });
      }

      (scan.router_discovery?.router_details || []).forEach(router => {
        addIpNode(router.ip, "Routeur", { isRouter: true, hostname: router.hostname || "" });
      });

      // Process subnets — routers stay inside their subnet
      (scan.subnet_scans || []).forEach(subnet => {
        const network = subnet.related_router_network || subnet.target_cidr;
        const subnetNodeId = toId(`subnet_${network}`);
        addGroupNode(subnetNodeId, `${network}`, "subnet");
        nodeMap.get(subnetNodeId).data.parent = "zone_network";
        (subnet.active_hosts || []).forEach(host => {
          const hostId = addHost(host, "host", "Host");
          if (hostId) {
            nodeMap.get(hostId).data.parent = subnetNodeId;
            assignedToSubnet.add(hostId);
          }
        });
      });

      // Chain edges along traceroute: router[i] → router[i+1] (disabled for now)
      // for (let i = 0; i < traceOrder.length - 1; i++) {
      //   const fromId = toId(`ip_${traceOrder[i]}`);
      //   const toIdVal = toId(`ip_${traceOrder[i + 1]}`);
      //   addEdge(fromId, toIdVal, "route");
      // }

      // VLAN hosts: only assign to zone_network if not already in a subnet
      (scan.vlan_scan?.active_hosts || []).forEach(host => {
        const hostId = addHost(host, "vlan", "VLAN Host");
        if (hostId && !assignedToSubnet.has(hostId)) {
          nodeMap.get(hostId).data.parent = "zone_network";
        }
      });

      function addHost(host, type, context) {
        if (!host.ip) return null;
        return addIpNode(host.ip, null, { type, context, hostname: host.hostname || "", mac: host.mac || "", status: host.status || "" });
      }

      nodeMap.forEach(value => {
        if (value.data.roles instanceof Set) value.data.roles = Array.from(value.data.roles);
        if (!value.data.label) value.data.label = value.data.id;
        if (value.data.hostname) {
          hostIndex.set(value.data.hostname.toLowerCase(), value.data.id);
          const shortHost = value.data.hostname.toLowerCase().split(".")[0];
          if (shortHost) hostIndex.set(shortHost, value.data.id);
        }
        if (value.data.ip) hostIndex.set(value.data.ip.toLowerCase(), value.data.id);
        if (!value.data.parent && value.data.id !== "zone_network") value.data.parent = "zone_network";
        nodeDataIndex.set(value.data.id, value.data);
        nodes.push(value);
      });

      return { nodes, edges };
    }

    // ── Node detail card ──
    function formatMeta(data) {
      const meta = data.meta || {};
      const role = data.role || (Array.isArray(data.roles) ? data.roles[0] : "") || meta.type || "inconnu";
      return [`ID : ${data.id}`, `ROLE : ${role}`, `IP : ${data.ip || "-"}`, `HOSTNAME : ${data.hostname || "-"}`].join("\n");
    }

    function showNodeCard(node) {
      if (!node) return;
      const data = node.data();
      const role = data.role || (Array.isArray(data.roles) ? data.roles[0] : "") || data.meta?.type || "Inconnu";
      const services = (data.services || []).map(service => {
        if (typeof service === "string") return service;
        return {
          port: service.port ?? "?", proto: (service.protocol || "tcp").toLowerCase(),
          svc: service.service || service.product || "",
          version: [service.product, service.version, service.extrainfo].filter(Boolean).join(" ")
        };
      });
      const bodyLines = [
        { label: "ROLE", value: role },
        { label: "IP", value: data.ip || "-" },
        { label: "HOSTNAME", value: data.hostname || "-" },
      ];
      const serviceTable = services.length ? `
        <table class="node-card-table">
          <thead><tr><th>PORT</th><th>SERVICE</th><th>VERSION</th></tr></thead>
          <tbody>${services.map(entry => {
            if (typeof entry === "string") return `<tr><td colspan="3">${entry}</td></tr>`;
            return `<tr><td>${entry.port}/${entry.proto}</td><td>${entry.svc||"-"}</td><td>${entry.version||"-"}</td></tr>`;
          }).join("")}</tbody>
        </table>` : "";
      nodeCard.innerHTML = `
        <div class="node-card-header">${role || data.ip || data.id}</div>
        <div class="node-card-body">
          ${bodyLines.map(l => `<span><strong>${l.label}:</strong> ${l.value}</span>`).join("")}
          ${serviceTable}
        </div>`;
      nodeCard.classList.add("show");
      updateNodeCardPosition();
    }

    function updateNodeCardPosition() {
      if (!selectedNode || !nodeCard.classList.contains("show")) return;
      const bbox = selectedNode.renderedBoundingBox({ includeLabels: true, includeNodes: true });
      nodeCard.style.left = `${bbox.x1 + bbox.w / 2}px`;
      nodeCard.style.top = `${bbox.y2 + 12}px`;
    }

    // ── Layouts ──
    function runLayouts() {
      if (subnetLayoutRunning || !cy) return;
      subnetLayoutRunning = true;
      layoutNetworkZone();
      layoutIdentityZone();
      positionIdentityBelowNetwork();
      positionTransitNodes();
      cy.fit(undefined, 60);
      requestAnimationFrame(() => {
        layoutNetworkZoneRendered();
        positionIdentityBelowNetwork();
        positionTransitNodes();
        cy.fit(undefined, 60);
      });
      subnetLayoutRunning = false;
    }

    function layoutNetworkZone() {
      if (!cy) return;
      const zone = cy.getElementById("zone_network");
      if (!zone.length) return;
      const topLevel = cy.nodes().filter(n => n.data("parent") === "zone_network" && n.id() !== "zone_network");
      if (!topLevel.length) return;

      // Children horizontal inside each subnet
      topLevel.filter(n => n.isParent()).forEach(parent => {
        stackChildren(parent, 40, false, true);
      });

      // Order subnets by traceroute path
      const orderedClusters = [];
      const placedIds = new Set();

      if (traceOrder.length > 0) {
        traceOrder.forEach(ip => {
          // Find the subnet containing this router IP
          const match = topLevel.filter(n => n.isParent()).filter(s => {
            const cidr = s.data("label") || "";
            return ipInCidr(ip, cidr);
          });
          match.forEach(s => {
            if (!placedIds.has(s.id())) {
              const members = s.descendants();
              orderedClusters.push({ node: s, members, bb: members.boundingBox({ includeLabels: true }) });
              placedIds.add(s.id());
            }
          });
        });
      }
      // Add remaining top-level nodes not yet placed
      topLevel.forEach(node => {
        if (placedIds.has(node.id())) return;
        const members = node.isParent() ? node.descendants() : node;
        orderedClusters.push({ node, members, bb: members.boundingBox({ includeLabels: true }) });
      });

      const gapX = 60;
      let cursorX = 0;
      orderedClusters.forEach(cluster => {
        const w = Math.max(120, cluster.bb.w);
        const h = Math.max(80, cluster.bb.h);
        const targetCx = cursorX + w / 2;
        const curCx = cluster.bb.x1 + cluster.bb.w / 2;
        const curCy = cluster.bb.y1 + cluster.bb.h / 2;
        shiftCollection(cluster.members, targetCx - curCx, h / 2 - curCy);
        cursorX += w + gapX;
      });
    }

    // Helper: check if IP belongs to a CIDR
    function ipInCidr(ip, cidr) {
      const parts = cidr.match(/^(\d+\.\d+\.\d+\.\d+)\/(\d+)$/);
      if (!parts) return false;
      const toNum = s => s.split(".").reduce((a, o) => (a << 8) + parseInt(o), 0) >>> 0;
      const ipNum = toNum(ip);
      const netNum = toNum(parts[1]);
      const mask = parts[2] == 0 ? 0 : (~0 << (32 - parseInt(parts[2]))) >>> 0;
      return (ipNum & mask) === (netNum & mask);
    }

    function shiftCollection(collection, dx, dy) {
      if (!collection || !collection.length) return;
      if (typeof collection.positions === "function") {
        collection.positions(node => ({ x: node.position("x") + dx, y: node.position("y") + dy }));
        return;
      }
      collection.position({ x: collection.position("x") + dx, y: collection.position("y") + dy });
    }

    function stackChildren(parent, gap = 60, useRendered = false, horizontal = false) {
      const children = parent.children();
      if (!children.length) return;
      const sorted = children.sort((a, b) => a.id().localeCompare(b.id()));
      const boxes = [];
      const zoom = useRendered ? (cy ? cy.zoom() : 1) : 1;
      const curChildrenBb = children.boundingBox({ includeLabels: true });
      const centerX = curChildrenBb.x1 + curChildrenBb.w / 2;
      const centerY = curChildrenBb.y1 + curChildrenBb.h / 2;
      sorted.forEach(node => {
        const bb = useRendered ? node.renderedBoundingBox({ includeLabels: true }) : node.boundingBox({ includeLabels: true });
        const w = useRendered ? (bb.w / zoom) : bb.w;
        const h = useRendered ? (bb.h / zoom) : bb.h;
        boxes.push({ w, h });
      });
      if (horizontal) {
        // Wrap into grid rows if many nodes (max ~8 per row)
        const maxCols = Math.min(8, sorted.length);
        const numRows = Math.ceil(sorted.length / maxCols);
        const rowGap = gap * 1.2;
        // Build rows
        const rows = [];
        for (let r = 0; r < numRows; r++) {
          const start = r * maxCols;
          const end = Math.min(start + maxCols, sorted.length);
          const rowNodes = [];
          let rowW = 0;
          let rowH = 0;
          for (let i = start; i < end; i++) {
            rowNodes.push({ node: sorted[i], box: boxes[i] });
            rowW += boxes[i].w;
            rowH = Math.max(rowH, boxes[i].h);
          }
          rowW += gap * (rowNodes.length - 1);
          rows.push({ nodes: rowNodes, totalW: rowW, maxH: rowH });
        }
        const totalH = rows.reduce((s, r) => s + r.maxH, 0) + rowGap * (rows.length - 1);
        let yCursor = -totalH / 2;
        rows.forEach(row => {
          let xCursor = -row.totalW / 2;
          row.nodes.forEach(({ node, box }) => {
            node.position({ x: centerX + xCursor + box.w / 2, y: centerY + yCursor + row.maxH / 2 });
            xCursor += box.w + gap;
          });
          yCursor += row.maxH + rowGap;
        });
      } else {
        let totalH = boxes.reduce((s, b) => s + b.h, 0) + gap * (boxes.length - 1);
        let yCursor = -totalH / 2;
        sorted.forEach((node, idx) => {
          const h = boxes[idx].h;
          node.position({ x: centerX, y: centerY + yCursor + h / 2 });
          yCursor += h + gap;
        });
      }
    }

    function layoutNetworkZoneRendered() {
      if (!cy) return;
      const zone = cy.getElementById("zone_network");
      if (!zone.length) return;
      const topLevel = cy.nodes().filter(n => n.data("parent") === "zone_network" && n.id() !== "zone_network");
      if (!topLevel.length) return;
      const gapX = 60;
      const zoom = cy.zoom() || 1;

      topLevel.filter(n => n.isParent()).forEach(parent => {
        stackChildren(parent, 40, true, true);
      });

      // Order subnets by traceroute path (same logic as layoutNetworkZone)
      const orderedClusters = [];
      const placedIds = new Set();

      if (traceOrder.length > 0) {
        traceOrder.forEach(ip => {
          topLevel.filter(n => n.isParent()).filter(s => ipInCidr(ip, s.data("label") || "")).forEach(s => {
            if (!placedIds.has(s.id())) {
              const members = s.descendants();
              const rbb = members.renderedBoundingBox({ includeLabels: true });
              orderedClusters.push({ node: s, members, bb: { x1: rbb.x1/zoom, y1: rbb.y1/zoom, w: rbb.w/zoom, h: rbb.h/zoom } });
              placedIds.add(s.id());
            }
          });
        });
      }
      topLevel.forEach(node => {
        if (placedIds.has(node.id())) return;
        const members = node.isParent() ? node.descendants() : node;
        const rbb = (typeof members.renderedBoundingBox === "function")
          ? members.renderedBoundingBox({ includeLabels: true })
          : members.boundingBox({ includeLabels: true });
        orderedClusters.push({ node, members, bb: { x1: rbb.x1/zoom, y1: rbb.y1/zoom, w: rbb.w/zoom, h: rbb.h/zoom } });
      });

      let cursorX = 0;
      orderedClusters.forEach(cluster => {
        const w = Math.max(80, cluster.bb.w);
        const h = Math.max(80, cluster.bb.h);
        shiftCollection(cluster.members, cursorX + w/2 - (cluster.bb.x1 + cluster.bb.w/2), h/2 - (cluster.bb.y1 + cluster.bb.h/2));
        cursorX += w + gapX;
      });
    }

    function layoutIdentityZone() {
      if (!adGraphState) return;
      // When network zone is displayed, scale identity to avoid being much wider
      const zoneNetwork = cy ? cy.getElementById("zone_network") : null;
      let maxWidth = null;
      if (zoneNetwork && zoneNetwork.length) {
        const netNodes = zoneNetwork.descendants();
        if (netNodes.length) {
          const netBox = netNodes.boundingBox();
          // Allow identity to be up to 1.5x the network width, but no more
          maxWidth = Math.max(netBox.w * 1.5, 800);
        }
      }
      layoutAdMode1(maxWidth);
    }

    function positionIdentityBelowNetwork() {
      const zoneNetwork = cy.getElementById("zone_network");
      const zoneIdentity = cy.getElementById("zone_identity");
      if (!zoneNetwork.length || !zoneIdentity.length) return;
      const networkNodes = zoneNetwork.descendants().filter(n => n.id() !== "zone_network");
      const identityNodes = zoneIdentity.descendants().filter(n => n.id() !== "zone_identity");
      if (!identityNodes.length) return;
      const networkBox = networkNodes.boundingBox();
      const identityBox = identityNodes.boundingBox();
      const gap = 120;
      const networkCenterX = networkBox.x1 + networkBox.w / 2;
      const identityCenterX = identityBox.x1 + identityBox.w / 2;
      const dx = networkCenterX - identityCenterX;
      const dy = (networkBox.y2 + gap) - identityBox.y1;
      identityNodes.positions(node => ({ x: node.position("x") + dx, y: node.position("y") + dy }));
    }

    function positionTransitNodes() {
      if (!cy) return;
      const parents = cy.nodes(":parent");
      const parentIds = new Set(parents.map(n => n.id()));
      cy.nodes().forEach(node => {
        if (node.parent().length) {
          const pid = node.parent().id();
          if (pid !== "zone_network") return;
        }
        const role = node.data("role");
        if (role !== "Routeur") return;
        const connectedParents = node.connectedEdges().connectedNodes().filter(n => parentIds.has(n.id()));
        if (connectedParents.length < 2) return;
        let sumX = 0, sumY = 0;
        connectedParents.forEach(p => { sumX += p.position().x; sumY += p.position().y; });
        node.position({ x: sumX / connectedParents.length, y: sumY / connectedParents.length });
      });
    }

    // ── AD elements builder ──
    function normalizeHostname(value) {
      if (!value) return "";
      return value.toLowerCase().replace(/\.$/, "").split(".")[0];
    }

    function buildAdElements(adGraph) {
      const nodes = adGraph.nodes || [];
      const edgesRaw = adGraph.edges || [];
      const idMap = new Map();
      const elements = [];
      const adNodeIds = new Set();
      const mappedEdges = [];
      const bridgeRights = new Set(["HasSession", "LoggedOn", "AdminTo", "CanRDP", "CanPSRemote"]);

      elements.push({
        data: {
          id: "zone_identity", label: "IDENTITE",
          bg: "rgba(15, 23, 42, 0.02)", borderColor: "#94a3b8", textColor: "#0f172a",
          meta: { type: "zone" }, isGroup: 1, isZone: 1, isAD: 1
        }
      });

      const startNodeId = adGraph.start_node;
      const computerNodeIds = new Set();

      // Pre-scan to identify Computer nodes
      nodes.forEach(n => { if ((n.type || "Unknown") === "Computer") computerNodeIds.add(n.id); });

      nodes.forEach(node => {
        const nodeId = node.id;
        const type = node.type || "Unknown";
        const label = node.display_name || node.name || node.id;
        const isStartNode = (nodeId === startNodeId || nodeId.toString() === startNodeId);

        if (type === "Computer") {
          const hostKey = normalizeHostname(label);
          const mapped = hostIndex.get(hostKey) || hostIndex.get(label.toLowerCase());
          if (mapped) {
            const physical = nodeDataIndex.get(mapped);
            if (physical) {
              idMap.set(nodeId, mapped);
              physical.meta = { ...(physical.meta || {}), ad_computer: true };
              physical.label = buildNetworkLabel(physical);
              return;
            }
          }
        }

        const adId = `ad_${nodeId}`;
        idMap.set(nodeId, adId);
        adNodeIds.add(adId);

        const tier = node.tier !== undefined ? node.tier : null;
        const isTarget = node.is_target || false;
        const isCertTemplate = type === "CertTemplate";
        const isComputer = type === "Computer";
        // Computers keep their own color (#c4b5fd) with tier-colored border
        const bgColor = isStartNode ? START_USER_COLOR
          : isComputer ? adTypeColors.Computer
          : isCertTemplate ? adTypeColors.CertTemplate
          : (tier !== null ? (tierColors[tier] || tierColors[2]) : (adTypeColors[type] || adTypeColors.Unknown));
        const borderColor = isStartNode ? START_USER_BORDER
          : isCertTemplate ? "#be185d"
          : (tier !== null ? (tierBorderColors[tier] || tierBorderColors[2]) : "#9ca3af");

        elements.push({
          data: {
            id: adId, label, type, roles: [type],
            bg: bgColor, borderColor, textColor: "#0f172a",
            meta: { type, tier }, isTarget, isStart: isStartNode,
            isAD: 1, parent: "zone_identity"
          }
        });
      });

      let edgeCounter = 0;
      edgesRaw.forEach(edge => {
        const rawSrc = edge.src || edge.source;
        const rawDst = edge.dst || edge.target;
        const src = idMap.get(rawSrc) || idMap.get(rawSrc?.toString()) || rawSrc;
        const dst = idMap.get(rawDst) || idMap.get(rawDst?.toString()) || rawDst;
        const right = edge.right || edge.kind || "AD";
        const srcIsAd = adNodeIds.has(src);
        const dstIsAd = adNodeIds.has(dst);
        if (srcIsAd && dstIsAd) mappedEdges.push({ source: src, target: dst });
        const kind = (bridgeRights.has(edge.right) && (!srcIsAd || !dstIsAd)) ? "bridge" : "ad";
        // Edge from a Computer = uncertain (requires local admin, not guaranteed)
        const viaComputer = computerNodeIds.has(rawSrc) ? 1 : 0;
        elements.push({
          data: {
            id: `ad_e${edgeCounter++}`, source: src, target: dst,
            label: right, kind, viaComputer,
            severity: edge.severity || null,
            isShortest: edge.is_shortest ? 1 : 0,
            isAD: 1,
            allRights: (edge.all_rights && edge.all_rights.length > 1) ? edge.all_rights : null
          }
        });
      });

      const startIdRaw = adGraph.start_node;
      const startIdMapped = startIdRaw ? (idMap.get(startIdRaw) || idMap.get(startIdRaw.toString()) || startIdRaw) : null;
      adGraphState = { startId: startIdMapped, adNodeIds, edges: mappedEdges };
      return elements;
    }

    // ── AD BFS layout ──
    function layoutAdMode1(maxWidth) {
      if (!cy || !adGraphState) return;
      const { startId, adNodeIds, edges } = adGraphState;
      if (!adNodeIds || !adNodeIds.size) return;
      const rootId = startId && cy.getElementById(startId).length ? startId : Array.from(adNodeIds)[0];

      const adjacency = new Map();
      edges.forEach(({ source, target }) => {
        if (!adjacency.has(source)) adjacency.set(source, []);
        adjacency.get(source).push(target);
      });

      const depths = new Map();
      const queue = [];
      depths.set(rootId, 0);
      queue.push(rootId);
      while (queue.length) {
        const cur = queue.shift();
        (adjacency.get(cur) || []).forEach(nxt => {
          if (!depths.has(nxt)) { depths.set(nxt, depths.get(cur) + 1); queue.push(nxt); }
        });
      }

      const byDepth = new Map();
      adNodeIds.forEach(id => {
        const depth = depths.get(id) ?? 6;
        if (!byDepth.has(depth)) byDepth.set(depth, []);
        byDepth.get(depth).push(id);
      });

      const maxDepth = Math.max(...byDepth.keys(), 1);
      // Target total width ~1200px, clamp xStep between 250 and 400
      const targetWidth = 1200;
      let xStep = maxDepth > 0 ? Math.round(targetWidth / maxDepth) : 400;
      xStep = Math.min(400, Math.max(250, xStep));
      const yStep = 150;
      byDepth.forEach((ids, depth) => {
        ids.sort();
        const totalHeight = (ids.length - 1) * yStep;
        ids.forEach((id, i) => {
          const node = cy.getElementById(id);
          if (!node.length) return;
          node.position({ x: depth * xStep, y: -totalHeight / 2 + i * yStep });
        });
      });
    }
  </script>
